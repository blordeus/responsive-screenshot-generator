<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screenshotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & tokens ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:    #F4F0E8;
    --slate:    #435066;
    --pine:     #365349;
    --graphite: #1F1F1F;
    --olive:    #768079;
    --bg:       #141414;
    --surface:  #1e1e1e;
    --border:   #2c2c2c;
    --text:     #e8e4dc;
    --muted:    #666;
    --accent:   #F4F0E8;
    --green:    #4caf7d;
    --red:      #e05a5a;
    --amber:    #d4a04a;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Layout ─────────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 340px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: var(--cream);
  }

  .logo span { color: var(--olive); }

  .header-tag {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 7px;
  }

  /* ── Sidebar / form panel ────────────────────────────────────── */
  .sidebar {
    padding: 28px 24px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--olive); font-weight: 500; }

  input[type="text"],
  input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus,
  input[type="number"]:focus {
    border-color: var(--olive);
  }

  input[type="text"]::placeholder { color: var(--muted); }

  /* Toggles */
  .toggles { display: flex; flex-direction: column; gap: 10px; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .toggle-row:hover { border-color: var(--olive); }

  .toggle-row .t-label { font-size: 12.5px; }
  .toggle-row .t-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .toggle {
    width: 34px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }

  .toggle.on { background: var(--pine); }
  .toggle.on::after { transform: translateX(16px); background: var(--cream); }

  /* Run button */
  .btn-run {
    width: 100%;
    padding: 12px;
    background: var(--cream);
    color: var(--graphite);
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-run:hover { opacity: 0.9; }
  .btn-run:active { transform: scale(0.98); }
  .btn-run:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Batch section */
  .batch-area {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 12px;
    min-height: 80px;
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11.5px;
    line-height: 1.8;
    resize: none;
    outline: none;
    min-height: 90px;
  }

  textarea::placeholder { color: var(--muted); }

  .btn-batch {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: var(--olive);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }

  .btn-batch:hover { border-color: var(--olive); color: var(--cream); }
  .btn-batch:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Main / results panel ────────────────────────────────────── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .results-header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .results-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--cream);
  }

  .job-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .results-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Empty state */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    text-align: center;
  }

  .empty-icon { font-size: 36px; opacity: 0.3; }
  .empty-text { font-size: 13px; }

  /* Job card */
  .job-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .job-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .job-status {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .job-status.running { background: var(--amber); animation: pulse 1s infinite; }
  .job-status.done    { background: var(--green); }
  .job-status.error   { background: var(--red); }
  .job-status.queued  { background: var(--muted); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  .job-url {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--cream);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .job-time {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .btn-open {
    font-size: 11px;
    color: var(--olive);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-open:hover { border-color: var(--olive); color: var(--cream); }

  /* Log */
  .job-log {
    padding: 10px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.9;
    border-bottom: 1px solid var(--border);
  }

  .log-line.ok   { color: var(--green); }
  .log-line.err  { color: var(--red); }

  /* Screenshots grid */
  .screenshots-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 16px 18px;
  }

  .shot-card {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .shot-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .shot-label span {
    color: var(--border);
    margin: 0 4px;
  }

  .shot-label em { color: var(--olive); font-style: normal; }

  .shot-img {
    width: 100%;
    border-radius: 5px;
    border: 1px solid var(--border);
    display: block;
    cursor: zoom-in;
    transition: border-color 0.15s;
  }

  .shot-img:hover { border-color: var(--olive); }

  .composite-row {
    padding: 0 18px 18px;
  }

  .composite-row .shot-label { margin-bottom: 8px; }

  .composite-img {
    width: 100%;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
    cursor: zoom-in;
    transition: border-color 0.15s;
  }

  .composite-img:hover { border-color: var(--olive); }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 6px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.8);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo">screen<span>shotter</span></div>
    <div class="header-tag">local tool</div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Single URL -->
    <div>
      <div class="section-label">Single URL</div>

      <div class="field" style="margin-bottom:10px">
        <label>URL</label>
        <input type="text" id="url" placeholder="https://example.com" />
      </div>

      <div class="field" style="margin-bottom:16px">
        <label>Label <span style="color:var(--muted);font-weight:300">(optional)</span></label>
        <input type="text" id="label" placeholder="Client Name" />
      </div>

      <div class="toggles" style="margin-bottom:16px">
        <div class="toggle-row" onclick="toggle('composite')">
          <div>
            <div class="t-label">Composite image</div>
            <div class="t-sub">All 3 viewports in one PNG</div>
          </div>
          <div class="toggle on" id="toggle-composite"></div>
        </div>
        <div class="toggle-row" onclick="toggle('fullpage')">
          <div>
            <div class="t-label">Full page</div>
            <div class="t-sub">Capture entire scrollable page</div>
          </div>
          <div class="toggle" id="toggle-fullpage"></div>
        </div>
      </div>

      <div class="field" style="margin-bottom:16px">
        <label>Extra wait <span style="color:var(--muted);font-weight:300">(seconds)</span></label>
        <input type="number" id="wait" value="0" min="0" max="10" style="width:80px" />
      </div>

      <button class="btn-run" id="btn-run" onclick="runSingle()">
        <span id="btn-run-icon">▶</span>
        <span id="btn-run-text">Capture</span>
      </button>
    </div>

    <div class="divider">or</div>

    <!-- Batch -->
    <div>
      <div class="section-label">Batch</div>
      <div class="batch-area">
        <textarea id="batch-urls" placeholder="https://clientone.com&#10;https://clienttwo.com&#10;https://clientthree.com"></textarea>
      </div>
      <button class="btn-batch" id="btn-batch" onclick="runBatch()">
        ⊞ Run Batch
      </button>
    </div>

  </aside>

  <!-- Results -->
  <main class="main">
    <div class="results-header">
      <h2>Results</h2>
      <div class="job-count" id="job-count">0 jobs</div>
    </div>
    <div class="results-scroll" id="results-scroll">
      <div class="empty" id="empty-state">
        <div class="empty-icon">⬚</div>
        <div class="empty-text">Enter a URL and click Capture</div>
      </div>
    </div>
  </main>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  // ── State ──────────────────────────────────────────────────────
  const state = { composite: true, fullpage: false };
  const activeJobs = new Set();
  let jobCount = 0;

  // ── Toggles ────────────────────────────────────────────────────
  function toggle(key) {
    state[key] = !state[key];
    document.getElementById(`toggle-${key}`).classList.toggle('on', state[key]);
  }

  // ── Run single ─────────────────────────────────────────────────
  async function runSingle() {
    const url = document.getElementById('url').value.trim();
    if (!url) { document.getElementById('url').focus(); return; }

    const label = document.getElementById('label').value.trim() || null;
    const wait  = parseInt(document.getElementById('wait').value) || 0;

    setRunning(true);
    await startJob({ url, label, full_page: state.fullpage, wait, composite: state.composite });
    setRunning(false);
  }

  // ── Run batch ──────────────────────────────────────────────────
  async function runBatch() {
    const lines = document.getElementById('batch-urls').value
      .split('\n')
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#'));

    if (!lines.length) { document.getElementById('batch-urls').focus(); return; }

    document.getElementById('btn-batch').disabled = true;
    document.getElementById('btn-batch').textContent = `Running ${lines.length} URLs…`;

    for (const line of lines) {
      const parts = line.split('\t');
      const url   = parts[0].trim();
      const label = parts[1]?.trim() || null;
      await startJob({ url, label, full_page: state.fullpage, wait: 0, composite: state.composite });
    }

    document.getElementById('btn-batch').disabled = false;
    document.getElementById('btn-batch').textContent = '⊞ Run Batch';
  }

  // ── Start job ──────────────────────────────────────────────────
  async function startJob(payload) {
    const res  = await fetch('/api/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const { job_id } = await res.json();

    jobCount++;
    document.getElementById('job-count').textContent =
      `${jobCount} job${jobCount !== 1 ? 's' : ''}`;

    document.getElementById('empty-state')?.remove();

    // Insert card at top
    const card = createJobCard(job_id, payload.label || payload.url);
    const scroll = document.getElementById('results-scroll');
    scroll.insertBefore(card, scroll.firstChild);

    activeJobs.add(job_id);
    pollJob(job_id);
  }

  // ── Poll job ───────────────────────────────────────────────────
  async function pollJob(job_id) {
    const interval = setInterval(async () => {
      const res  = await fetch(`/api/job/${job_id}`);
      const data = await res.json();

      updateJobCard(job_id, data);

      if (data.status === 'done' || data.status === 'error') {
        clearInterval(interval);
        activeJobs.delete(job_id);
      }
    }, 800);
  }

  // ── Job card ───────────────────────────────────────────────────
  function createJobCard(job_id, display) {
    const card = document.createElement('div');
    card.className = 'job-card';
    card.id = `job-${job_id}`;

    const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    card.innerHTML = `
      <div class="job-header">
        <div class="job-status queued" id="status-${job_id}"></div>
        <div class="job-url">${escHtml(display)}</div>
        <div class="job-time">${time}</div>
        <button class="btn-open" id="open-${job_id}" style="display:none" onclick="openFolder('${job_id}')">Open ↗</button>
      </div>
      <div class="job-log" id="log-${job_id}"></div>
      <div id="shots-${job_id}"></div>
    `;
    return card;
  }

  function updateJobCard(job_id, data) {
    const statusEl = document.getElementById(`status-${job_id}`);
    const logEl    = document.getElementById(`log-${job_id}`);
    const shotsEl  = document.getElementById(`shots-${job_id}`);
    const openBtn  = document.getElementById(`open-${job_id}`);

    if (statusEl) {
      statusEl.className = `job-status ${data.status}`;
    }

    if (logEl && data.log) {
      logEl.innerHTML = data.log.map(line => {
        const cls = line.includes('Done') ? 'ok' : line.includes('Error') ? 'err' : '';
        return `<div class="log-line ${cls}">${escHtml(line)}</div>`;
      }).join('');
    }

    if (data.status === 'done' && data.results && shotsEl && !shotsEl.dataset.rendered) {
      shotsEl.dataset.rendered = '1';

      const viewports = ['desktop', 'tablet', 'mobile'].filter(k => data.results[k]);
      if (viewports.length) {
        const grid = document.createElement('div');
        grid.className = 'screenshots-grid';

        viewports.forEach(name => {
          const r   = data.results[name];
          const vp  = { desktop: 1440, tablet: 768, mobile: 375 };
          const src = `/files/${r.file}`;
          grid.innerHTML += `
            <div class="shot-card">
              <div class="shot-label">
                ${name}<span>·</span><em>${vp[name]}px</em>
              </div>
              <img class="shot-img" src="${src}" alt="${name}" loading="lazy"
                   onclick="openLightbox('${src}')" />
            </div>
          `;
        });

        shotsEl.appendChild(grid);
      }

      if (data.results.composite) {
        const src = `/files/${data.results.composite.file}`;
        const row = document.createElement('div');
        row.className = 'composite-row';
        row.innerHTML = `
          <div class="shot-label">composite<span>·</span><em>all viewports</em></div>
          <img class="composite-img" src="${src}" alt="composite" loading="lazy"
               onclick="openLightbox('${src}')" />
        `;
        shotsEl.appendChild(row);
      }

      if (openBtn && data.output_dir) {
        openBtn.style.display = 'block';
        openBtn.dataset.path  = data.output_dir;
      }
    }
  }

  async function openFolder(job_id) {
    const btn  = document.getElementById(`open-${job_id}`);
    const path = btn?.dataset?.path;
    if (path) await fetch(`/api/open-folder?path=${encodeURIComponent(path)}`);
  }

  // ── UI helpers ─────────────────────────────────────────────────
  function setRunning(on) {
    const btn  = document.getElementById('btn-run');
    const icon = document.getElementById('btn-run-icon');
    const txt  = document.getElementById('btn-run-text');
    btn.disabled = on;
    icon.textContent = on ? '…' : '▶';
    txt.textContent  = on ? 'Capturing…' : 'Capture';
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Lightbox ───────────────────────────────────────────────────
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    if ((e.key === 'Enter') && document.activeElement.id === 'url') runSingle();
  });
</script>
</body>
</html>
